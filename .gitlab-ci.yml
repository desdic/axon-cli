# Tests every push. On a vX.Y.Z tag, also builds the Arch package from the
# tag and uploads it to the project's Generic Package Registry:
#   $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/axon-cli/<version>/<file>

stages: [test, package]

test:
  stage: test
  image: rust:latest
  script:
    - rustup component add clippy rustfmt
    - cargo fmt --all -- --check
    - make clippy
    - make test

package:arch:
  stage: package
  image: archlinux:base-devel
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  script:
    - pacman -Syu --noconfirm rust git
    - VERSION=${CI_COMMIT_TAG#v}
    # The source tarball the PKGBUILD expects, made from the tag; makepkg uses
    # it instead of downloading. vendor/ and .cargo/config.toml are in git, so
    # the build works offline.
    - git archive --format=tar.gz --prefix=axon-cli-$VERSION/ -o pkg/arch/axon-cli-$VERSION.tar.gz HEAD
    # makepkg refuses to run as root
    - useradd -m builder && chown -R builder pkg/arch
    - su builder -c 'cd pkg/arch && makepkg --noconfirm'
    - |
      for f in pkg/arch/axon-cli-$VERSION-*.pkg.tar.zst; do
        curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$f" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/axon-cli/$VERSION/$(basename "$f")"
      done
  artifacts:
    paths: [pkg/arch/*.pkg.tar.zst]
